<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>patreonarr</title>
<style>
  :root {
    --ink: #16141d;
    --surface: #201d2b;
    --surface-2: #262233;
    --line: #2e2a3d;
    --paper: #f4f0e8;
    --muted: #a79fb6;
    --coral: #ff424d;
    --coral-deep: #d92d38;
    --sage: #8fc39b;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font: 15px/1.6 "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto 0;
    height: 220px;
    background: radial-gradient(60% 100% at 50% 0%, #33244a 0%, transparent 70%);
    pointer-events: none;
  }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; border-radius: 4px; }
  .bar {
    position: sticky;
    top: 0;
    z-index: 5;
    backdrop-filter: blur(12px);
    background: color-mix(in srgb, var(--ink) 82%, transparent);
    border-bottom: 1px solid var(--line);
  }
  .bar-in {
    max-width: 660px;
    margin: 0 auto;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .wordmark { color: var(--muted); font-size: 13px; font-weight: 500; }
  #pollBtn { margin-left: auto; }
  main { max-width: 660px; margin: 0 auto; padding: 28px 20px 80px; position: relative; }
  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px;
  }
  .row-form { display: flex; gap: 8px; }
  input[type=text], textarea {
    flex: 1;
    min-width: 0;
    background: var(--ink);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--paper);
    padding: 10px 12px;
    font: inherit;
  }
  input[type=text]::placeholder, textarea::placeholder { color: #6f6880; }
  input[type=text]:hover, textarea:hover { border-color: #453d5e; }
  button {
    font: inherit;
    font-weight: 600;
    border: 0;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    color: #fff;
    text-align: center;
    background: #38334d;
    white-space: nowrap;
  }
  button:hover { background: #443d5c; }
  button:disabled { opacity: .55; cursor: wait; }
  button.primary { background: var(--coral); }
  button.primary:hover { background: var(--coral-deep); }
  button.ghost {
    background: transparent;
    color: var(--muted);
    font-weight: 500;
    padding: 6px 8px;
  }
  button.ghost:hover { color: var(--paper); background: #ffffff10; }
  h2 { font-size: 17px; letter-spacing: -0.01em; margin: 34px 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  ul.clean { list-style: none; margin: 0; padding: 0; }
  .creator {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 8px;
    border-bottom: 1px solid var(--line);
  }
  .creator:last-child { border-bottom: 0; }
  .mono {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 16px;
    color: #fff;
    background: #4a3350;
    border: 1px solid #ffffff22;
    flex: none;
    text-transform: lowercase;
  }
  .who { min-width: 0; flex: 1; }
  .who a {
    display: block;
    text-decoration: none;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .who a:hover { text-decoration: underline; }
  .who small { color: var(--muted); font-size: 12.5px; }
  .post {
    padding: 12px 8px;
    border-bottom: 1px solid var(--line);
  }
  .post:last-child { border-bottom: 0; }
  .post-t { font-weight: 600; overflow-wrap: anywhere; }
  .post-m { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .post-m a { color: var(--muted); }
  .pill {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    padding: 1px 9px;
    border-radius: 999px;
    margin-left: 8px;
    vertical-align: 1px;
    background: #2c3a2f;
    color: var(--sage);
    border: 1px solid #3a4f3f;
  }
  .pill.none { background: transparent; color: var(--muted); border-color: var(--line); font-weight: 500; }
  .empty {
    color: var(--muted);
    padding: 22px 8px;
    text-align: left;
  }
  details.conn {
    margin-top: 34px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--surface);
  }
  details.conn summary {
    cursor: pointer;
    padding: 14px 16px;
    font-weight: 600;
    list-style: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  details.conn summary::-webkit-details-marker { display: none; }
  details.conn summary span.hint { color: var(--muted); font-weight: 400; font-size: 13px; }
  .conn-body { padding: 0 16px 16px; }
  textarea { width: 100%; min-height: 88px; resize: vertical; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; }
  .conn-actions { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
  #toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(8px);
    background: var(--paper);
    color: #17151d;
    font-weight: 600;
    font-size: 13.5px;
    padding: 9px 16px;
    border-radius: 999px;
    opacity: 0;
    transition: opacity .2s, transform .2s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  main { animation: rise .35s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) {
    main { animation: none; }
    #toast { transition: none; }
  }
  @media (max-width: 520px) {
    .row-form { flex-direction: column; }
  }
</style>

<header class="bar">
  <div class="bar-in">
    <div class="wordmark">patreonarr</div>
    <button class="primary" id="pollBtn" style="padding:7px 14px;font-size:13px">Poll now</button>
  </div>
</header>

<main>
  <div class="panel">
    <div class="row-form">
      <input type="text" id="url" placeholder="Paste a creator link, like patreon.com/c/someone/posts" autocomplete="off" spellcheck="false">
      <button class="primary" id="addBtn">Add</button>
    </div>
  </div>

  <h2>Creators</h2>
  <p class="sub" id="creatorCount"></p>
  <ul class="clean" id="list"></ul>

  <h2>Recent posts</h2>
  <p class="sub">Latest pickups from your creators.</p>
  <ul class="clean" id="seen"></ul>

  <details class="conn">
    <summary>Connection <span class="hint">cookies needed for member-only posts</span></summary>
    <div class="conn-body">
      <textarea id="cookies" placeholder="Paste cookies.txt content here" spellcheck="false"></textarea>
      <div class="conn-actions">
        <button id="cookieBtn">Save cookies</button>
      </div>
    </div>
  </details>
</main>
<div id="toast" role="status"></div>

<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const hues = [330, 265, 200, 160, 25, 300, 220];
  let toastT;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastT);
    toastT = setTimeout(() => t.classList.remove("show"), 2200);
  }
  function vanity(url) {
    const m = String(url).match(/\/c\/([^\/]+)/) || String(url).match(/patreon\.com\/([^\/]+)/);
    return (m && m[1]) || url;
  }
  function ago(ts) {
    if (!ts) return "never checked";
    const s = Date.now() / 1000 - ts;
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s / 60) + "m ago";
    if (s < 86400) return Math.floor(s / 3600) + "h ago";
    return Math.floor(s / 86400) + "d ago";
  }
  function colorFor(name) {
    let h = 0;
    for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 997;
    return hues[h % hues.length];
  }
  async function api(method, path, body) {
    const r = await fetch(path, { method, body });
    if (!r.ok) throw new Error(await r.text() || r.statusText);
    return r.json().catch(() => ({}));
  }
  async function refresh() {
    let creators = [], seen = [];
    try { creators = await api("GET", "/api/creators"); } catch {}
    try { seen = await api("GET", "/api/seen"); } catch {}
    $("creatorCount").textContent = creators.length
      ? creators.length + (creators.length === 1 ? " creator" : " creators") + " followed"
      : "";
    $("list").innerHTML = creators.length ? creators.map(c => {
      const v = vanity(c.url);
      return `<li class="creator">
        <div class="mono" style="background:hsl(${colorFor(v)} 32% 32%)">${esc(v[0] || "?")}</div>
        <div class="who"><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(v)}</a>
        <small>${c.last_check ? "checked " + esc(ago(c.last_check)) : "not checked yet"}</small></div>
        <button class="ghost" data-del="${esc(c.url)}">Remove</button>
      </li>`;
    }).join("") : `<li class="empty">Nothing here yet. Paste a creator link above to start.</li>`;
    $("seen").innerHTML = seen.length ? seen.slice(0, 30).map(p => {
      const n = (p.yt_ids || []).length;
      const links = (p.yt_ids || []).map(id =>
        `<a href="https://youtu.be/${esc(id)}" target="_blank" rel="noopener">${esc(id)}</a>`).join(", ");
      return `<li class="post"><span class="post-t">${esc(p.title || p.post_id)}</span>` +
        (n ? `<span class="pill">${n} video${n === 1 ? "" : "s"}</span>` : `<span class="pill none">no video</span>`) +
        (links ? `<div class="post-m">${links}</div>` : "") + `</li>`;
    }).join("") : `<li class="empty">No posts picked up yet. They will appear here after the next poll.</li>`;
  }
  $("list").addEventListener("click", async e => {
    const b = e.target.closest("[data-del]");
    if (!b) return;
    b.disabled = true;
    await api("DELETE", "/api/creators?url=" + encodeURIComponent(b.dataset.del));
    toast("Creator removed");
    refresh();
  });
  async function add() {
    const input = $("url");
    const v = input.value.trim();
    if (!v) { input.focus(); return; }
    $("addBtn").disabled = true;
    try {
      await api("POST", "/api/creators", JSON.stringify({ url: v }));
      input.value = "";
      toast("Creator added");
      refresh();
    } catch (err) { toast(String(err.message || err)); }
    $("addBtn").disabled = false;
  }
  $("addBtn").onclick = add;
  $("url").addEventListener("keydown", e => { if (e.key === "Enter") add(); });
  $("pollBtn").onclick = async () => {
    $("pollBtn").disabled = true;
    $("pollBtn").textContent = "Polling";
    try {
      await api("POST", "/api/poll");
      toast("Poll started");
      setTimeout(refresh, 2500);
    } catch (err) { toast(String(err.message || err)); }
    $("pollBtn").disabled = false;
    $("pollBtn").textContent = "Poll now";
  };
  $("cookieBtn").onclick = async () => {
    const v = $("cookies").value;
    if (!v.trim()) { $("cookies").focus(); return; }
    $("cookieBtn").disabled = true;
    try {
      await api("POST", "/api/cookies", v);
      $("cookies").value = "";
      toast("Cookies saved");
    } catch (err) { toast(String(err.message || err)); }
    $("cookieBtn").disabled = false;
  };
  refresh();
</script>
